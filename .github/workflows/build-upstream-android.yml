name: Build Upstream Votol Configurator APK - Clean Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-upstream-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build trigger repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Git HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com"

      - name: Clone upstream source unchanged
        run: |
          git clone --depth 1 https://github.com/HackMan37/votol-configurator.git upstream
          cd upstream
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install upstream dependencies
        working-directory: upstream
        run: |
          # Keep upstream application source unchanged. Only replace the inaccessible
          # SSH git dependency with the published package in the temporary CI clone.
          npm pkg set dependencies.capacitor-usb-serial="1.0.3"
          rm -f package-lock.json
          rm -rf ~/.npm/_cacache/tmp/*
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Patch Bluetooth plugin for raw VOTOL binary frames
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path("node_modules").glob("**/BluetoothCommunicationPlugin.java"))
          if not matches:
              raise SystemExit("BluetoothCommunicationPlugin.java not found")
          for p in matches:
              s = p.read_text()
              old_send = 'outputStream.write(data.getBytes());'
              new_send = 'outputStream.write(data.getBytes(java.nio.charset.StandardCharsets.ISO_8859_1));'
              old_recv = 'new String(buffer, 0, bytes, StandardCharsets.UTF_8)'
              new_recv = 'new String(buffer, 0, bytes, StandardCharsets.ISO_8859_1)'
              if old_send in s:
                  s = s.replace(old_send, new_send)
              if old_recv in s:
                  s = s.replace(old_recv, new_recv)
              if old_send in s or old_recv in s:
                  p.write_text(s)
              print(p)
              print("  ISO-8859-1 send:", new_send in s)
              print("  ISO-8859-1 receive:", new_recv in s)
          PY

      - name: Build upstream web app
        working-directory: upstream
        run: npm run build

      - name: Add Android platform
        working-directory: upstream
        run: npx cap add android

      - name: Add Bluetooth permissions to upstream plugin manifest
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("node_modules/@yesprasoon/capacitor-bluetooth-communication/android/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          """
          if "android.permission.BLUETOOTH_SCAN" not in s:
              end = s.find(">", s.find("<manifest"))
              if end < 0:
                  raise SystemExit("Plugin AndroidManifest.xml: opening <manifest> tag not found")
              s = s[:end + 1] + permissions + s[end + 1:]
              p.write_text(s)
          PY

      - name: Sync Capacitor
        working-directory: upstream
        run: npx cap sync android

      - name: Add JitPack repository for upstream USB serial dependency
        working-directory: upstream
        run: |
          printf '\nallprojects { repositories { maven { url "https://jitpack.io" } } }\n' >> android/build.gradle

      - name: Ensure Bluetooth permissions in app manifest
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          """
          if "android.permission.BLUETOOTH_SCAN" not in s:
              end = s.find(">", s.find("<manifest"))
              if end < 0:
                  raise SystemExit("AndroidManifest.xml: opening <manifest> tag not found")
              s = s[:end + 1] + permissions + s[end + 1:]
              p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: upstream/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify merged Bluetooth permissions
        working-directory: upstream
        run: |
          MERGED="android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          test -f "$MERGED"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$MERGED"
          grep -q 'android.permission.BLUETOOTH_CONNECT' "$MERGED"
          echo "Merged manifest contains Bluetooth scan/connect permissions."
          grep 'android.permission.BLUETOOTH' "$MERGED"

      - name: Verify APK
        working-directory: upstream
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk classes.dex >/dev/null
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          echo "Built upstream commit: $UPSTREAM_COMMIT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolConfigurator-upstream-debug-apk
          path: upstream/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
